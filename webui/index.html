<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      document.documentElement.lang = localStorage.getItem('kairos-locale') ?? 'zh-CN';
      (function () {
        var stored = localStorage.getItem('kairos-theme');
        var isDark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      href="https://fontsapi.zeoseven.com/2/main/result.css"
      rel="preload"
      as="style"
      crossorigin
      onload="this.rel = 'stylesheet'"
    />
    <noscript
      ><link rel="stylesheet" href="https://fontsapi.zeoseven.com/2/main/result.css"
    /></noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kairos management console — gateway health, API keys, and account usage."
    />
    <meta property="og:title" content="Kairos Management" />
    <meta
      property="og:description"
      content="Kairos management console — gateway health, API keys, and account usage."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kairos" />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kairos Management" />
    <meta
      name="twitter:description"
      content="Kairos management console — gateway health, API keys, and account usage."
    />
    <meta name="twitter:image" content="/favicon.svg" />
    <title>Kairos Management</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
