[package]
name = "kairos"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "time", "fs", "sync"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "json"] }
hmac = "0.13"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "migrate", "runtime-tokio", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
futures-util = "0.3"
lru = "0.18"
async-stream = "0.3"
thiserror = "2.0"
bytes = "1.11"
base64 = "0.22"
rand = "0.10"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
rust-embed = "8.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "ansi"] }
argon2 = { version = "0.5", features = ["password-hash", "std"] }
sha2 = "0.11"
secrecy = "0.10"
serde_path_to_error = "0.1"

[dev-dependencies]
insta = { version = "1.48.0", features = ["json"] }
tempfile = "3.27"
proptest = "1.7"
similar-asserts = "1.7"
