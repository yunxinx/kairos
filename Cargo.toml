[package]
name = "kairos"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "time"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "json"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "migrate", "runtime-tokio", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
async-stream = "0.3"
thiserror = "2.0"
bytes = "1.11"
base64 = "0.22"
rand = "0.10"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
rust-embed = "8.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "ansi"] }
argon2 = { version = "0.5", features = ["password-hash", "std"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.27"
